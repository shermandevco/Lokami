<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lokami</title>
<meta name="theme-color" content="#e6336e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokami">
<meta name="description" content="Lokami — your life and your people in one place">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-width column, floating tab bar, gradient hero + tinted tiles, full-screen swipe deck */
/* Layout idea: phone-width column, floating tab bar, gradient hero + tinted tiles; accent palette follows the active member's theme */
:root{--p0:#e6336e;--p2:#ff8f4c;--deep:#3b1d4a;--mid:#b02a86;
  --bg:color-mix(in srgb,var(--p0) 5%,#f6f4f7);--surface:#ffffff;--surface2:color-mix(in srgb,var(--p0) 7%,#efecf1);--ink:#211a26;--mut:#7d7384;--line:#e6e1ea;
  --pri:var(--p0);--pri2:var(--p2);--plum:var(--deep);--ok:#19a57a;--soft:color-mix(in srgb,var(--p0) 13%,#fff);--shadow:0 8px 28px rgba(40,30,60,.09);
  --display:'Unbounded','Manrope',system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
:root[data-th="steel"]{--p0:#2f6fed;--p2:#19b7c9;--deep:#0f1f47;--mid:#2443a8}
:root[data-th="forest"]{--p0:#17936b;--p2:#8cc63f;--deep:#0d2e2a;--mid:#136e63}
:root[data-th="graphite"]{--p0:#f0652f;--p2:#e8862a;--deep:#1c1f2b;--mid:#6b3a2c}
:root[data-th="berry"]{--p0:#e6336e;--p2:#ff8f4c;--deep:#3b1d4a;--mid:#b02a86}
:root[data-th="lavender"]{--p0:#8b5cf6;--p2:#ec6fd0;--deep:#2a1a55;--mid:#6a3fd0}
:root[data-th="rose"]{--p0:#ff5c8a;--p2:#ffb36b;--deep:#7a2350;--mid:#e04a8c}
:root[data-m="dark"]{--bg:color-mix(in srgb,var(--p0) 6%,#121015);--surface:#1f1b24;--surface2:#2b2632;--ink:#f4eff7;--mut:#a69dae;--line:#3a3342;--pri:color-mix(in srgb,var(--p0) 78%,#fff);--ok:#3fd0a0;--soft:color-mix(in srgb,var(--p0) 28%,#1f1b24);--shadow:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{transition:background .4s;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}h2{font-size:15px;font-weight:700}h3{font-size:13px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:13px}.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;padding:18px 16px 118px;min-height:100vh}
#screen{display:flex;flex-direction:column;gap:14px}

/* transitions */
@keyframes inTab{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes inFwd{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes addIn{from{opacity:0;transform:translateY(-8px);max-height:0}to{opacity:1;transform:none;max-height:90px}}
#screen.tab{animation:inTab .28s ease-out}#screen.fwd{animation:inFwd .28s cubic-bezier(.2,.8,.2,1)}#screen.back{animation:inBack .28s cubic-bezier(.2,.8,.2,1)}
#screen.anim .st{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}

/* building blocks */
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.press{transition:transform .15s}.press:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:16px;font-weight:800;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(.95)}
.btn.ghost{background:var(--surface2);color:var(--ink)}.btn.sm{min-height:36px;padding:0 12px;border-radius:12px;font-size:13px}
.btn.wide{width:100%}.btn.danger{background:none;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--line)}
.ibtn{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;flex:none;transition:transform .15s}
.ibtn:active{transform:scale(.9)}
.inp{width:100%;min-height:46px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:0;transition:border-color .2s}
.inp:focus{border-color:var(--pri)}textarea.inp{padding:12px 14px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:99px;background:var(--surface2);font-weight:700;font-size:13px;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.94)}.chip.on{background:var(--ink);color:var(--bg)}
.chip.add{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mut)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:11px;font-weight:700;font-size:13px;color:var(--mut);transition:all .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty b{display:block;font-size:40px;margin-bottom:6px}

/* top bars */
.top{display:flex;align-items:center;gap:12px;min-height:46px}
.top h1{flex:1}
.avs{display:flex}.av{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 3px var(--bg),var(--shadow);transition:transform .25s}
.av+.av{margin-left:-10px}.av.me{box-shadow:0 0 0 3px var(--pri);z-index:1;transform:scale(1.06)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,var(--pri) 0%,var(--mid) 48%,var(--plum) 100%);box-shadow:0 14px 34px color-mix(in srgb,var(--pri) 30%,transparent)}
.hero .big{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;letter-spacing:-.03em}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .ring{position:relative;width:96px;height:96px;flex:none}
.hero .ring svg{transform:rotate(-90deg)}
.hero .ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.hero .ring .bgc{stroke:rgba(255,255,255,.2)}.hero .ring .fg{stroke:#fff;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.hero .ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:10px;font-weight:700;line-height:1.2}
.hero .ring div b{font-family:var(--display);font-size:16px}
@keyframes float{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:.5}100%{transform:translateY(-190px) scale(1.2) rotate(20deg);opacity:0}}
.hero .fl{position:absolute;bottom:-10px;font-size:18px;animation:float 6s linear infinite;pointer-events:none}

/* question preview */
.qd{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;text-align:left;width:100%;display:block}
.qd .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.qd p{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.35;margin:10px 0 14px}
.qd .go{display:inline-flex;background:rgba(255,255,255,.22);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px}
.qd::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}

/* tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:112px;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.tile b{font-weight:800}.tile span{font-size:12px;color:var(--mut)}
.tile .bd{position:absolute;top:12px;right:12px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--pri);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.stat{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;transition:transform .15s}.stat:active{transform:scale(.96)}
.stat .n{font-family:var(--display);font-weight:800;font-size:26px}

/* moods */
.moods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px}.moods::-webkit-scrollbar{display:none}
.mood{flex:none;width:52px;height:52px;border-radius:18px;font-size:26px;background:var(--surface2);display:grid;place-items:center;transition:transform .2s,background .2s}
.mood.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--pri);animation:pop .35s}
.mood:active{transform:scale(.88)}

/* lists */
.composer{display:flex;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);transition:opacity .2s,transform .2s,max-height .25s,padding .25s;max-height:120px;overflow:hidden}
.it:last-child{border-bottom:0}
.it.new{animation:addIn .3s ease-out}
.it.out{opacity:0;transform:translateX(40px);max-height:0;padding-top:0;padding-bottom:0}
.it .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;transition:color .2s}
.it.done .tx{color:var(--mut);text-decoration:line-through}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .2s;color:transparent;font-size:14px;font-weight:900}
.it.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}.it.flash .ck{animation:pop .35s}
.xb{width:32px;height:32px;border-radius:10px;color:var(--mut);font-size:18px;flex:none}
.grp{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.04em;margin:14px 0 2px;text-transform:uppercase}.grp:first-child{margin-top:0}

/* deck tiles */
.deck{position:relative;overflow:hidden;border-radius:22px;padding:14px;color:#fff;text-align:left;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s;box-shadow:var(--shadow)}
.deck:active{transform:scale(.95) rotate(-1deg)}
.deck .em{font-size:30px}.deck b{font-family:var(--display);font-size:14px;font-weight:700;display:block}
.deck small{font-size:12px;opacity:.9}
.deck .pb{height:4px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:8px}.deck .pb i{display:block;height:100%;border-radius:9px;background:#fff}
.deck .lock{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:99px}

/* play overlay */
#play{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;padding:16px 16px 22px;background:var(--bg)}
#play.on{display:flex;animation:inTab .3s ease-out}
#play .inner{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.stack{position:relative;flex:1;min-height:260px;max-height:520px;margin:6px 6px 22px}
.qc{position:absolute;inset:0;border-radius:30px;padding:26px 24px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(0,0,0,.2);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;will-change:transform}
.qc.n1{transform:translateY(16px) scale(.94);filter:brightness(.9)}.qc.n2{transform:translateY(32px) scale(.88);filter:brightness(.8)}
@keyframes promote{from{transform:translateY(16px) scale(.94)}to{transform:none}}
.qc.top{align-items:stretch;gap:0;animation:promote .3s cubic-bezier(.2,.8,.2,1);cursor:grab}
.qc .hd{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.qc p{font-family:var(--display);font-weight:700;font-size:clamp(19px,5.6vw,25px);line-height:1.35;margin:0;text-wrap:balance}
.qc .ft{font-size:13px;opacity:.85;font-weight:600}
.qc .wm{position:absolute;right:-10px;bottom:-24px;font-size:150px;opacity:.16;pointer-events:none}
.pctl{display:flex;justify-content:center;align-items:center;gap:14px}
.pb1{width:54px;height:54px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:22px;display:grid;place-items:center;transition:transform .15s}
.pb1:active{transform:scale(.86)}.pb1.xl{width:68px;height:68px;font-size:26px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.pb1.fav{animation:pop .35s}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;font-weight:800;color:var(--mut);padding:4px 0}
.cal .d{position:relative;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;transition:background .2s,transform .15s}
.cal .d:active{transform:scale(.88)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cal .d.sel{background:var(--ink);color:var(--bg)}
.cal .d.has::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--pri)}
@keyframes calL{from{opacity:0;transform:translateX(24px)}}@keyframes calR{from{opacity:0;transform:translateX(-24px)}}
.cal.l{animation:calL .25s ease-out}.cal.r{animation:calR .25s ease-out}
.ev{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev .e{width:42px;height:42px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:20px;flex:none}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--pri);white-space:nowrap}

/* movies */
.mv{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.mv:last-child{border:0}
.stars button{font-size:20px;color:#f2b01e;transition:transform .15s}.stars button:active{transform:scale(1.4)}
.slot{min-height:64px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;padding:10px 14px}
.slot.hit{animation:pop .4s;background:var(--soft);color:var(--pri)}

/* idea card */
@keyframes flip{0%{transform:rotateY(90deg) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.idea{border-radius:26px;padding:24px;min-height:150px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--mid),var(--pri));font-family:var(--display);font-weight:700;font-size:19px;line-height:1.35}
.idea.flip{animation:flip .4s cubic-bezier(.2,.8,.2,1)}.idea small{font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}

/* wheel */
.wheelbox{container-type:inline-size;position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto}
.wheel{position:absolute;inset:0;border-radius:50%;transition:transform 4s cubic-bezier(.12,.75,.1,1);box-shadow:0 0 0 8px var(--surface),var(--shadow)}
.wheel span{position:absolute;left:50%;top:50%;width:0;height:0;color:#fff;font-weight:800;font-size:12px}
.wheel span i{position:absolute;font-style:normal;white-space:nowrap;transform:translate(-50%,-50%);max-width:96px;overflow:hidden;text-overflow:ellipsis}
.wptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:30px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.whub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow);z-index:2}

/* notes */
.bub{max-width:82%;padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--surface);box-shadow:var(--shadow);overflow-wrap:anywhere}
.bub.mine{align-self:flex-end;border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.bub small{display:block;font-size:11px;opacity:.75;margin-top:3px}
.bub.new{animation:pop .3s}

/* coupons */
.cpn{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 14px 14px 20px;box-shadow:var(--shadow);border-left:6px dashed var(--pri);overflow:hidden}
.cpn.used{opacity:.6;border-left-color:var(--line)}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.4);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:1}}
.cpn .stp{position:absolute;right:14px;top:50%;margin-top:-13px;border:2px solid var(--ok);color:var(--ok);font-weight:800;font-size:11px;padding:3px 8px;border-radius:8px;transform:rotate(-14deg);text-transform:uppercase}
.cpn .stp.new{animation:stamp .35s cubic-bezier(.2,.8,.2,1)}

/* tab bar */
#tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(448px,calc(100% - 28px));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:26px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 36px rgba(59,29,74,.2),inset 0 0 0 1px var(--line)}
#tabbar .ind{position:absolute;top:6px;left:6px;width:calc((100% - 12px)/5);height:calc(100% - 12px);border-radius:20px;background:var(--soft);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:10.5px;font-weight:800;color:var(--mut);transition:color .2s}
#tabbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
#tabbar button.on{color:var(--pri)}#tabbar button.on svg{transform:translateY(-1px) scale(1.12)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(20,10,25,.45)}
#sheet.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
#sheet .panel{width:100%;max-width:480px;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}

/* toast + fx */
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 14px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;transition:all .3s cubic-bezier(.2,.9,.2,1);pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{color:var(--pri2);font-weight:800}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#fx span{position:absolute;font-size:18px}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(var(--r))}}

/* onboarding */
#onb{position:fixed;inset:0;z-index:80;display:none;background:radial-gradient(120% 100% at 0% 0%,var(--pri) 0%,var(--mid) 50%,var(--plum) 100%);color:#fff;overflow:auto}
#onb.on{display:block}
#onb .inner{max-width:420px;margin:0 auto;min-height:100%;padding:36px 24px 28px;display:flex;flex-direction:column;gap:18px;justify-content:center;animation:inFwd .35s cubic-bezier(.2,.8,.2,1)}
#onb h1{font-size:30px;line-height:1.15;font-weight:800}
#onb .inp{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}#onb .inp::placeholder{color:rgba(255,255,255,.7)}
#onb .btn{background:#fff;color:var(--pri)}#onb .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
#onb .dots{display:flex;gap:6px}#onb .dots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.35);transition:all .3s}#onb .dots i.on{width:26px;background:#fff}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
#onb .logo{font-size:72px;animation:beat 1.6s infinite;align-self:flex-start}
.avpick{display:flex;gap:6px;flex-wrap:wrap}.avpick button{width:40px;height:40px;border-radius:13px;font-size:21px;background:var(--surface2);transition:transform .15s}
.avpick button.on{box-shadow:inset 0 0 0 2px var(--pri);background:var(--soft)}.avpick button:active{transform:scale(.85)}
#onb .avpick button{background:rgba(255,255,255,.16)}#onb .avpick button.on{background:#fff;box-shadow:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.03em}
#onb label.f{color:rgba(255,255,255,.85)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.hero .fl{display:none}}

/* v3 additions */
.gopill{display:inline-flex;background:rgba(255,255,255,.22);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;color:#fff}
.ibtn.flat{box-shadow:none;background:var(--surface2)}.hero .ibtn.flat{background:rgba(255,255,255,.2);color:#fff}.hero h2{color:#fff}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(20px)}
.tsw{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .15s;flex:none;display:inline-block}
.tsw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--a)}.tsw:active{transform:scale(.88)}.tsw.mini{width:14px;height:14px}
.mic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.msub{color:var(--mut)}
.amt{font-family:var(--display);font-weight:700;font-size:18px}
.hearts{display:flex;gap:6px}.hearts button{font-size:28px;transition:transform .15s}.hearts button:active{transform:scale(1.3)}
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.03em}
.cal.hc .d.has::after{content:"♥";background:none;width:auto;height:auto;font-size:10px;bottom:1px;color:var(--pri)}
.card.out{opacity:0;transform:translateX(40px);transition:all .2s}.card.pop{animation:pop .3s}
.avs .av{width:38px;height:38px;font-size:20px}
#onb .seg{background:rgba(255,255,255,.16)}#onb .seg button{color:rgba(255,255,255,.85)}#onb .seg button.on{background:#fff;color:var(--pri)}
#onb .chip{background:rgba(255,255,255,.16);color:#fff}#onb .chip.on{background:#fff;color:var(--pri)}
.typ{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;transition:all .2s}
.typ span{font-size:28px}.typ b{display:block;font-size:16px}.typ small{opacity:.85;font-size:13px}.typ.on{background:#fff;color:var(--plum);transform:scale(1.02)}.typ:active{transform:scale(.97)}
.obav{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);font-size:24px;flex:none;transition:transform .15s}.obav:active{transform:scale(.85) rotate(-8deg)}
.obmods{gap:12px;background:rgba(255,255,255,.12);border-radius:20px;padding:14px}.obmods .msub{color:rgba(255,255,255,.8)}.obmods .mic{background:rgba(255,255,255,.2)}.obmods .tag{background:rgba(255,255,255,.25);color:#fff}
#onb .sw{background:rgba(255,255,255,.28)}#onb .sw.on{background:#fff}#onb .sw.on::after{background:var(--pri)}

/* ===== v4: glass / vivid, dark, desktop shell, auth, diary, planner, garage ===== */
:root{--paper:#fffdf5;--pen:#27336b;--rule:rgba(60,80,160,.17);--glassline:rgba(255,255,255,.55)}
:root[data-m="dark"]{--paper:#27222e;--pen:#ece6f7;--rule:rgba(255,255,255,.11);--glassline:rgba(255,255,255,.09)}
:root[data-style="glass"]{--surface:rgba(255,255,255,.62);--surface2:color-mix(in srgb,var(--p0) 9%,rgba(255,255,255,.55));--line:rgba(120,110,140,.2)}
:root[data-style="glass"][data-m="dark"]{--surface:rgba(44,38,54,.58);--surface2:rgba(255,255,255,.08);--line:rgba(255,255,255,.12)}
:root[data-style="glass"] :is(.card,.tile,.stat,.ibtn,.cpn,.mp,.bub:not(.mine)){-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glassline)}
:root[data-style="glass"] .inp{background:color-mix(in srgb,var(--surface) 70%,transparent)}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.2;animation:drift 22s ease-in-out infinite alternate}
:root[data-style="glass"] #bg i{opacity:.5}:root[data-m="dark"] #bg i{opacity:.28}
#bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--p0)}
#bg i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:22vh;background:var(--p2);animation-duration:27s;animation-direction:alternate-reverse}
#bg i:nth-child(3){width:38vmax;height:38vmax;left:18vw;bottom:-20vmax;background:var(--mid);animation-duration:31s}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
#app{position:relative;z-index:1}
.inp{min-width:0}
button:disabled{opacity:.4;cursor:default}

/* mode switcher */
#modebar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:25;margin:-18px -16px 10px;padding:10px 16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
#modebar::-webkit-scrollbar{display:none}
.mp{flex:none;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 15px 0 11px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:13px;max-width:210px;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .3s,color .3s}
.mp span{font-size:19px}.mp b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent!important;transform:scale(1.05);box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 40%,transparent)}
.mp.add{width:42px;padding:0;justify-content:center;background:none;box-shadow:inset 0 0 0 2px var(--line);color:var(--mut);border:0!important}
.mp:active{transform:scale(.94)}
#rip{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;background:linear-gradient(135deg,var(--pri),var(--pri2))}
#rip.go{animation:rip .65s ease-out}
@keyframes rip{0%{opacity:.85;clip-path:circle(0 at var(--x,50%) var(--y,0))}60%{opacity:.5}100%{opacity:0;clip-path:circle(160% at var(--x,50%) var(--y,0))}}
@keyframes inMode{from{opacity:0;transform:scale(.94);filter:blur(10px)}}
#screen.mode{animation:inMode .5s cubic-bezier(.2,.8,.2,1)}

/* sidebar (desktop) */
#side{display:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px}.brand.big{font-size:26px}
.lg{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));position:relative;display:inline-block;flex:none}
.lg::before,.lg::after{content:"";position:absolute;top:10px;width:12px;height:12px;border:2.5px solid #fff;border-radius:50%;box-sizing:border-box}.lg::before{left:6px}.lg::after{right:6px}
.slbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 8px 4px}
.smodes{display:flex;flex-direction:column;gap:6px}.smodes .mp{max-width:none;width:100%;border-radius:16px;min-height:44px}.smodes .mp.on{transform:none}.smodes .mp.add{width:100%}
.sn{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:12px;font-weight:700;font-size:14px;text-align:left;transition:background .2s,transform .15s,color .2s}
.sn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.sn span{width:20px;text-align:center;flex:none}
.sn:hover{background:var(--surface2);transform:translateX(3px)}.sn.on{background:var(--soft);color:var(--pri)}
.suser{display:flex;align-items:center;gap:10px;padding:8px;border-radius:18px;text-align:left;background:var(--surface2)}.suser .av{box-shadow:none;flex:none}.suser small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:160px;white-space:nowrap}
@media (min-width:960px){
  #side{display:flex;position:fixed;left:0;top:0;bottom:0;width:272px;flex-direction:column;gap:2px;padding:20px 14px 16px;overflow:auto;z-index:20;background:color-mix(in srgb,var(--surface) 55%,transparent);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-right:1px solid var(--line)}
  #tabbar,#modebar{display:none}
  #app{max-width:none;margin:0 0 0 272px;padding:32px 40px 64px}
  #screen{display:block;columns:2;column-gap:20px;max-width:1080px;margin:0 auto}
  #screen>*{break-inside:avoid;margin-bottom:18px}
  #screen>:is(.top,.hero,.span,.seg,p,.bar,.inv){column-span:all}
  #screen:is([data-s="cards"],[data-s="together"],[data-s="diary"],[data-s="plan"],[data-s="notes"]){columns:1}
  #screen:is([data-s="plan"],[data-s="notes"]){max-width:680px}
  #screen:is([data-s="cards"],[data-s="together"]) .grid2{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  #screen[data-s="together"] .tile{margin:0}
  #screen[data-s="diary"]>.nbwrap,#screen[data-s="diary"]>.row{max-width:720px;margin-left:auto;margin-right:auto}
  .top h1{font-size:28px}.hero{padding:28px}.hero .big{font-size:68px}
  #sheet{align-items:center;padding:24px}#sheet .panel{border-radius:28px;max-width:520px;animation:pop .3s}#sheet .grab{display:none}
  #toast{bottom:32px;left:calc(50% + 136px)}
  .stack{max-height:460px}
}
@media (hover:hover){.tile:hover,.deck:hover,.stat:hover,.sprow:hover{transform:translateY(-3px)}.btn:hover{filter:brightness(1.06)}.chip:hover{filter:brightness(.97)}}

/* auth */
#auth{position:fixed;inset:0;z-index:45;display:none;overflow:auto;background:radial-gradient(120% 100% at 0% 0%,var(--pri) 0%,var(--mid) 50%,var(--plum) 100%);color:#fff}
#auth.on{display:block}
.aw{min-height:100%;max-width:1080px;margin:0 auto;padding:28px 20px;display:grid;gap:26px;align-content:center}
.apitch h1{font-size:clamp(26px,4.6vw,46px);line-height:1.12;font-weight:800;margin:18px 0 12px}
.apitch p{font-size:17px;opacity:.9;margin:0;max-width:46ch}
.afeat{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.af{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:700;font-size:14px;animation:bob 4s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.9s)}
@keyframes bob{to{transform:translateY(-8px)}}
#auth .lg{background:rgba(255,255,255,.25)}
.acard{background:var(--bg);color:var(--ink);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.acard .inp{background:var(--surface)}
.or{text-align:center;color:var(--mut);font-size:12px;font-weight:800}
.gg{width:24px;height:24px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:12px;color:var(--pri)}
.demo{font-size:12px;color:var(--mut);margin:0}
@media (min-width:900px){.aw{grid-template-columns:1.1fr .9fr;align-items:center;gap:60px;padding:48px}}

/* spaces, invite */
.typ2{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:18px;background:var(--surface2);transition:all .2s}
.typ2 span{font-size:28px}.typ2 b{display:block}.typ2 small{color:var(--mut);font-size:13px}.typ2.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--pri)}.typ2:active{transform:scale(.97)}
.sprow{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:18px;background:var(--surface2);transition:transform .15s}.sprow.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--pri)}
.codein{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.codebox{display:flex;gap:8px;justify-content:center}.codebox b{width:44px;height:56px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-size:24px;animation:pop .4s both}
.codebox b:nth-child(2){animation-delay:.05s}.codebox b:nth-child(3){animation-delay:.1s}.codebox b:nth-child(4){animation-delay:.15s}.codebox b:nth-child(5){animation-delay:.2s}.codebox b:nth-child(6){animation-delay:.25s}
.codebig{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.18em}
.card.inv{box-shadow:inset 0 0 0 2px var(--pri),var(--shadow)}
.tsw.cst{display:grid;place-items:center;position:relative;cursor:pointer;font-size:16px;overflow:hidden}.tsw.cst input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
button.av{font-size:22px}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.warn{background:#ffecc7;color:#9a5b00}.pill.bad{background:#ffd9d2;color:#b62a14}

/* diary */
.dnow{display:flex;flex-direction:column;align-items:center;line-height:1.2}.dnow b{font-family:var(--display);font-size:15px}.dnow span{font-size:12px;color:var(--mut);font-weight:700}
.nbwrap{perspective:1500px}
.nb{position:relative;background:var(--paper);color:var(--pen);border-radius:8px 24px 24px 8px;padding:20px 18px 26px 54px;box-shadow:0 18px 40px rgba(40,30,60,.16),inset 0 0 0 1px var(--rule);font-family:'Caveat','Manrope',cursive;font-size:23px;line-height:34px;min-height:480px;transform-origin:left center}
.nb::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:18px;background:radial-gradient(circle,var(--bg) 0 6px,transparent 7px) 0 0/18px 34px repeat-y}
.nb::after{content:"";position:absolute;left:43px;top:0;bottom:0;width:1.5px;background:rgba(230,70,90,.38)}
@keyframes flipN{from{transform:rotateY(-78deg);opacity:.15}}@keyframes flipP{from{transform:rotateY(-18deg) translateX(-46px);opacity:0}}
.nb.fn{animation:flipN .55s cubic-bezier(.2,.8,.2,1)}.nb.fp{animation:flipP .45s cubic-bezier(.2,.8,.2,1)}
.nbh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.nbd{font-size:68px;line-height:58px;font-weight:700}.nbm{font-size:24px;line-height:28px}
.nbmood{font-size:42px;display:flex;flex-direction:column;align-items:center;line-height:1;transform:rotate(7deg);transition:transform .2s}.nbmood small{font-size:17px;margin-top:2px}.nbmood:active{transform:rotate(-8deg) scale(1.15)}
.nbmoods{display:flex;flex-wrap:wrap;gap:6px;animation:rise .3s}.nbmoods button{font-size:30px;transition:transform .15s}.nbmoods button:active{transform:scale(1.3)}
.nbsec{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:12px;line-height:22px}
.nbl{display:block;width:100%;text-align:left;border-bottom:1px solid var(--rule);min-height:34px;overflow-wrap:anywhere}
.nbl small{font-size:17px;opacity:.6}.nbp.done{text-decoration:line-through;opacity:.5}.nbp i{font-style:normal}
.nbadd input{width:100%;border:0;border-bottom:1px dashed var(--rule);background:none;outline:0;height:34px;padding:0}.nbadd input::placeholder,.nb textarea::placeholder{color:var(--pen);opacity:.4}
.nb textarea{display:block;width:100%;border:0;outline:0;resize:none;background:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);line-height:34px;min-height:204px;padding:0;overflow:hidden}
.nbst{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.nbst button{font-size:36px;line-height:1;transform:rotate(var(--r));animation:pop .35s}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px}
.ym b{font-size:12px}.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.yd{aspect-ratio:1;border-radius:5px;background:var(--c,color-mix(in srgb,var(--ink) 10%,transparent));position:relative;transition:transform .15s}.yd:disabled{opacity:.3}.yd.today{box-shadow:0 0 0 2px var(--ink)}
.yd.w::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--ink);opacity:.75}.yd:not(:disabled):active{transform:scale(1.5)}
.ydl{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle}

/* planner */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd2{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:16px;background:var(--surface2);transition:all .2s}
.wd2 small{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase}.wd2 b{font-family:var(--display);font-size:15px}.wd2 i{width:6px;height:6px;border-radius:50%}.wd2 i.has{background:var(--pri)}.wd2 i.ok{background:var(--ok)}
.wd2.today{box-shadow:inset 0 0 0 2px var(--pri)}.wd2.sel{background:var(--ink);color:var(--bg);transform:translateY(-3px)}.wd2.sel small{color:inherit;opacity:.7}.wd2:active{transform:scale(.92)}

/* garage */
.carhero{position:relative;border-radius:28px;overflow:hidden;min-height:210px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--deep),var(--mid) 60%,var(--pri));color:#fff;box-shadow:var(--shadow)}
.carhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carem{position:absolute;right:22px;top:14px;font-size:112px;line-height:1;animation:drive 2.6s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(-10px)}to{transform:translateX(8px) rotate(-2deg)}}
.carinfo{position:relative;padding:44px 18px 16px;width:100%;background:linear-gradient(transparent,rgba(0,0,0,.62))}.carinfo h1{color:#fff}.carinfo div{opacity:.9;font-weight:700;margin-top:2px}
.carhero .ibtn{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.85);color:#222;border:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}.fact small{display:block;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.fact b{display:block;margin:2px 0 4px}
.big2{font-family:var(--display);font-weight:800;font-size:28px}

.top .seg button{white-space:nowrap;padding:0 10px}

function refresh(nk){if(!ME||!S)return;const sc=$('#screen'),keep={};if(!nk)sc.querySelectorAll('input[id],textarea[id]').forEach(e=>keep[e.id]=e.value);const fid=document.activeElement&&document.activeElement.id;sc.innerHTML=R[cur]();sc.className='';
  for(const id in keep){const e=document.getElementById(id);if(e&&e.type!=='date'&&e.type!=='file')e.value=keep[id]}if(fid&&keep[fid]!==undefined){const e=document.getElementById(fid);if(e)e.focus()}chrome();if(AFTER[cur])AFTER[cur](false);ui.flash=null;ui.newItem=null;ui.calDir=''}
window.addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(ME&&n&&n!==cur&&R[n])show(n)});
const subTop=(title,right)=>`<div class="top st"><button class="ibtn" data-a="go" data-v="together" data-dir="back" aria-label="${t('back')}">←</button><h1>${esc(title)}</h1>${right||''}</div>`;
function gate(kind,v){sheet(`<h1>${t('gate_t')}</h1><p style="margin:0">${t('gate_d')}</p><button class="btn" data-a="adultOk" data-k="${kind}" data-v="${esc(v)}">${t('gate_ok')}</button><button class="btn ghost" data-a="closeSheet">${t('not_now')}</button>`)}
const monthNav=(d,a)=>`<div class="row sp" style="margin-bottom:10px"><button class="ibtn flat" data-a="${a}" data-v="-1" aria-label="‹">‹</button><h2>${monT(d)}</h2><button class="ibtn flat" data-a="${a}" data-v="1" aria-label="›">›</button></div>`;
const wdays=()=>[0,1,2,3,4,5,6].map(i=>`<div class="wd">${wdS(new Date(2024,0,1+i))}</div>`).join('');

/* ================= fx ================= */
function burst(el,set){if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,fx=$('#fx');set=set||['💗','💖','✨','💕'];
  for(let i=0;i<9;i++){const s=document.createElement('span');const a=Math.random()*6.28,d=40+Math.random()*50;s.textContent=set[i%set.length];s.style.cssText=`left:${x-9}px;top:${y-9}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px;--r:${Math.random()*120-60}deg;animation:burst .7s ease-out forwards`;fx.appendChild(s);setTimeout(()=>s.remove(),750)}}
function confetti(){const fx=$('#fx'),set=['🎉','✨','⭐','💫','🎊','💖'];for(let i=0;i<34;i++){const s=document.createElement('span');const d=1.5+Math.random()*1.4;s.textContent=set[i%set.length];s.style.cssText=`left:${Math.random()*100}%;top:0;font-size:${14+Math.random()*14}px;--r:${Math.random()*720-360}deg;animation:fall ${d}s ${Math.random()*.5}s ease-in forwards;transform:translateY(-10vh)`;fx.appendChild(s);setTimeout(()=>s.remove(),(d+.6)*1000)}}
let toastT,toastFn;
function toast(msg,label,fn){const el=$('#toast');toastFn=fn;el.innerHTML=`<span>${esc(msg)}</span>${label?`<button data-a="toastAct">${esc(label)}</button>`:''}`;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),label?4200:2200)}
function sheet(html){const s=$('#sheet'),was=s.classList.contains('on'),keep={};s.querySelectorAll('input[id],textarea[id]').forEach(e=>keep[e.id]=e.type==='checkbox'?e.checked:e.value);
  s.innerHTML=`<div class="panel" ${was?'style="animation:none"':''}><div class="grab"></div>${html}</div>`;s.classList.add('on');
  if(was)for(const id in keep){const e=document.getElementById(id);if(e){if(e.type==='checkbox')e.checked=keep[id];else e.value=keep[id]}}
  else{const f=$('#sheet [data-focus]');if(f)setTimeout(()=>f.focus(),250)}}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheet').innerHTML=''}
const sw=(on,a,v)=>`<button class="sw ${on?'on':''}" role="switch" aria-checked="${!!on}" data-a="${a}" data-v="${v}"></button>`;

R.home=()=>{

  if(d!=null){const nx=MILES.find(x=>x>d)||d+1000,pv=[...MILES].reverse().find(x=>x<=d)||0,p=(d-pv)/(nx-pv),C=2*Math.PI*40;let parts='';

  if(modOn('budget')){const ym=td.slice(0,7),s=S.exp.filter(e=>e.d.startsWith(ym)).reduce((a,e)=>a+e.a,0);tiles.push(['budget','💰',mt('budget'),money(s),S.bud?t('of_lim',money(S.bud)):t('this_month')])}
  const up=upcoming(3),ln=S.notes[S.notes.length-1];
  return `<div class="top st"><div class="grow"><div class="mut sm" style="font-weight:700">${t('g'+(new Date().getHours()<5?0:new Date().getHours()<12?1:new Date().getHours()<18?2:3))}</div><h1>${esc(sname(S))}</h1></div>
    ${M().length>1?`<button class="avs press" data-a="who" aria-label="${t('who_using')}">${M().slice(0,5).map((m,i)=>`<span class="av ${i===S.me?'me':''}">${m.a}</span>`).join('')}</button>`:`<span class="av">${me().a}</span>`}</div>
  ${hero}
  ${modOn('mood')?`<div class="card st col"><div class="row sp"><h2>${t('how_today',esc(me().n))}</h2><span class="row" style="gap:4px">${others}</span></div><div class="moods">${Object.keys(MOODS).map(m=>`<button class="mood ${my&&my.m===m?'on':''}" data-a="mood" data-v="${m}" aria-label="${MOODS[m][L]}">${m}</button>`).join('')}</div></div>`:''}
  <button class="qd st press" style="${grad(qk)}" data-a="play" data-v="${qk}" data-i="${qi}"><div class="lbl">${t('qod')} · ${DECKS[qk].n[L]}</div><p>${esc(DECKS[qk].q[qi][L])}</p><span class="go">${t('discuss')}</span></button>
  <div class="card st col"><div class="row sp"><h2>${t('chal')}</h2><span class="tag">🏆 ${S.chalN}</span></div><p style="margin:0;font-weight:600">${esc(ch)}</p>${cd?`<span class="pill" style="align-self:flex-start">✓ ${t('chal_done')}</span>`:`<button class="btn sm" style="align-self:flex-start" data-a="chalDone">${t('done_btn')}</button>`}</div>
  ${tiles.length?`<div class="grid2 st">${tiles.map((x,i)=>`<button class="stat" ${tiles.length%2&&i===tiles.length-1?'style="grid-column:1/-1"':''} data-a="go" data-v="${x[0]}" data-dir="fwd"><div class="row sp"><span style="font-size:22px">${x[1]}</span><span class="mut sm">${x[2]}</span></div><div class="n num">${x[3]}</div><div class="mut sm">${x[4]}</div></button>`).join('')}</div>`:''}
  <div class="card st"><div class="row sp" style="margin-bottom:4px"><h2>${t('upcoming')}</h2><button class="btn ghost sm" data-a="go" data-v="calendar">${t('tab_cal')}</button></div>
    ${up.map(e=>`<div class="ev"><div class="e">${e.e||'📌'}</div><div class="grow"><b>${esc(e.t)}</b><div class="mut sm">${fmt(e.o)}</div></div><span class="pill">${rel(diff(td,e.o))}</span></div>`).join('')||`<p class="mut sm" style="margin:8px 0 0">${t('no_events')}</p>`}</div>
  ${modOn('notes')?`<button class="card st press" style="text-align:left" data-a="go" data-v="notes" data-dir="fwd"><div class="row sp"><h2>${mt('notes')}</h2><span class="tag">💌 ${S.notes.length}</span></div><p style="margin:8px 0 0" class="${ln?'':'mut sm'}">${ln?'«'+esc(ln.t)+'» <span class="mut sm">· '+esc(wn(ln.who))+'</span>':mt('notes',1)}</p></button>`:''}`};
AFTER.home=(anim)=>{const r=$('#ringfg');if(r)requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.strokeDashoffset=r.dataset.o));
  const c=$('#cnt');if(c&&anim){const n=+c.dataset.n,t0=performance.now();const step=x=>{const k=Math.min(1,(x-t0)/900),e=1-Math.pow(1-k,3);c.textContent=Math.round(n*e);if(k<1&&cur==='home')requestAnimationFrame(step);else c.textContent=n};c.textContent=0;requestAnimationFrame(step)}};

const LISTS={shop:{key:'shop',opt:'cat'},chores:{key:'chores',opt:'who'},wishes:{key:'wishes',opt:'whose'},dreams:{key:'bucket'}};
function listScreen(id){const Lc=LISTS[id],k=Lc.key,items=S[k],done=items.filter(i=>i.done).length,multi=M().length>1;let opts='';
  if(Lc.opt==='cat'){if(ui.opt[k]==null)ui.opt[k]=7;opts=`<div class="chips">${CATS.map((c,i)=>`<button type="button" class="chip ${ui.opt[k]===i?'on':''}" data-a="opt" data-k="${k}" data-v="${i}" data-num="1">${cn(CATS,i)}</button>`).join('')}</div>`}
  else if(Lc.opt&&multi){const vals=M().map(m=>[m.id,m.a+' '+m.n]);if(Lc.opt==='who')vals.push(['*','👥 '+t('all')]);if(!vals.some(v=>v[0]===ui.opt[k]))ui.opt[k]=Lc.opt==='who'?'*':me().id;
    opts=`<div class="chips">${vals.map(v=>`<button type="button" class="chip ${ui.opt[k]===v[0]?'on':''}" data-a="opt" data-k="${k}" data-v="${v[0]}">${esc(v[1])}</button>`).join('')}</div>`}
  const row=(it,i)=>`<div class="it ${it.done?'done':''} ${ui.flash===k+i?'flash':''} ${ui.newItem===k+i?'new':''}"><button class="ck" data-a="tog" data-k="${k}" data-i="${i}" aria-label="✓">✓</button><span class="tx">${esc(it.t)}</span>${it.who&&multi?`<span class="tag">${wa(it.who)} ${esc(wn(it.who))}</span>`:''}<button class="xb" data-a="del" data-k="${k}" data-i="${i}" aria-label="${t('del')}">×</button></div>`;
  let body;const idx=items.map((it,i)=>[it,i]);
  if(!items.length)body=`<div class="empty"><b>${MODS[id].em}</b>${t('empty_list')}</div>`;
  else if(Lc.opt==='cat'){const open=idx.filter(x=>!x[0].done),dn=idx.filter(x=>x[0].done),cats=[...new Set(open.map(x=>x[0].cat))];
    body=cats.map(c=>`<div class="grp">${cn(CATS,c)}</div>`+open.filter(x=>x[0].cat===c).map(x=>row(...x)).join('')).join('')+(dn.length?`<div class="grp">${t('bought')}</div>`+dn.map(x=>row(...x)).join(''):'')}
  else body=idx.filter(x=>!x[0].done).map(x=>row(...x)).join('')+idx.filter(x=>x[0].done).map(x=>row(...x)).join('');
  let score='';if(id==='chores'&&multi){const c=M().map(m=>items.filter(i=>i.done&&(i.who===m.id||i.who==='*')).length),mx=Math.max(1,...c);
    score=`<div class="card st col"><h2>${t('score')}</h2>${M().map((m,n)=>`<div class="row"><span style="font-size:22px">${m.a}</span><div class="grow"><div class="row sp sm"><b>${esc(m.n)}</b><span class="num mut">${c[n]}</span></div><div class="bar"><i style="width:${c[n]/mx*100}%"></i></div></div></div>`).join('')}${items.some(i=>!i.done)?`<button class="btn ghost sm" data-a="shuffle">${t('shuffle')}</button>`:''}</div>`}
  const sg=(SUG[k]||[]).map(s=>s[L]).filter(s=>!items.some(i=>i.t===s));
  return subTop(mt(id),items.length?`<span class="tag num">${done}/${items.length}</span>`:'')+(items.length&&!score?`<div class="bar st"><i style="width:${done/items.length*100}%"></i></div>`:'')+score+
  `<div class="card st col"><form class="composer" data-f="add" data-k="${k}"><input class="inp" id="in-${k}" placeholder="${t('ph_'+id)}" autocomplete="off" enterkeyhint="done"><button class="btn" aria-label="${t('add')}">＋</button></form>${opts}</div>
  <div class="card st">${body}${done?`<button class="btn ghost sm wide" style="margin-top:12px" data-a="clearDone" data-k="${k}">${t('clear_done',done)}</button>`:''}</div>
  ${sg.length?`<div class="st col"><h3 class="mut">${t('quick_add')}</h3><div class="chips wrap">${sg.map(s=>`<button class="chip add" data-a="sugg" data-k="${k}" data-v="${esc(s)}">＋ ${esc(s)}</button>`).join('')}</div></div>`:''}`}

function WH(){const a=[];if(M().length>1){let o=M().map(m=>m.n);while(o.length<6)o=o.concat(M().map(m=>m.n));a.push({n:t('wh_who'),o:o.slice(0,12)})}a.push({n:t('wh_eat'),o:WEAT.map(x=>x[L])},{n:t('wh_do'),o:WDO.map(x=>x[L])},{n:t('wh_own'),o:S.wheel.length>1?S.wheel:[t('yes'),t('no')],own:1});return a}

R.budget=()=>{const ym=bM.getFullYear()+'-'+pad(bM.getMonth()+1),list=S.exp.map((e,i)=>[e,i]).filter(x=>x[0].d.startsWith(ym)).sort((a,b)=>a[0].d<b[0].d?1:-1),tot=list.reduce((s,x)=>s+x[0].a,0),lim=S.bud,mm=M();
  const byC=BCATS.map((c,i)=>[i,list.filter(x=>x[0].c===i).reduce((s,x)=>s+x[0].a,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!mm.some(m=>m.id===ui.bw))ui.bw=me().id;let split='';
  if(mm.length>1&&tot>0){const bal=mm.map(m=>({m,p:list.filter(x=>x[0].who===m.id).reduce((s,x)=>s+x[0].a,0)}));const paid=bal.reduce((s,x)=>s+x.p,0),sh=paid/mm.length,mx=Math.max(1,...bal.map(x=>x.p));
    const deb=bal.filter(x=>sh-x.p>.5).map(x=>({m:x.m,b:sh-x.p})),cre=bal.filter(x=>x.p-sh>.5).map(x=>({m:x.m,b:x.p-sh})),tr=[];let i=0,j=0;
    while(i<deb.length&&j<cre.length){const a=Math.min(deb[i].b,cre[j].b);tr.push([deb[i].m,cre[j].m,a]);deb[i].b-=a;cre[j].b-=a;if(deb[i].b<.5)i++;if(cre[j].b<.5)j++}

      ${tr.map(x=>`<div class="row sp" style="font-weight:700"><span>${x[0].a} ${esc(x[0].n)} → ${x[1].a} ${esc(x[1].n)}</span><span class="pill num">${money(Math.round(x[2]))}</span></div>`).join('')||`<span class="pill" style="align-self:flex-start">✓ ${t('bud_even')}</span>`}</div>`}

    ${mm.length>1?`<div class="chips"><span class="mut sm" style="align-self:center;font-weight:700;flex:none">${t('bud_paid')}:</span>${mm.map(m=>`<button class="chip ${ui.bw===m.id?'on':''}" data-a="bw" data-v="${m.id}">${m.a} ${esc(m.n)}</button>`).join('')}</div>`:''}</div>

let P=null;
function openPlay(k,i){const D=DECKS[k];if(!D)return;if(D.lvl===3&&!ME.adult){gate('deck',k);return}P={k,i:i!=null?+i:((S.seen[k]||0)>=D.q.length?0:(S.seen[k]||0))};$('#play').classList.add('on');document.body.style.overflow='hidden';renderPlay()}
function closePlay(){P=null;$('#play').classList.remove('on');document.body.style.overflow='';refresh()}
function renderPlay(noAnim){const D=DECKS[P.k],n=D.q.length,el=$('#play');
  if(P.i>=n){el.innerHTML=`<div class="inner"><div class="row sp"><button class="ibtn" data-a="closePlay" aria-label="${t('close')}">✕</button></div><div class="col" style="flex:1;justify-content:center;text-align:center;align-items:center"><div style="font-size:72px;animation:pop .5s">🎉</div><h1>${t('deck_done',D.n[L])}</h1><p class="mut" style="margin:0">${n} ${pl(n,'q')}</p><button class="btn" data-a="replay">${t('again')}</button><button class="btn ghost" data-a="closePlay">${t('to_decks')}</button></div></div>`;confetti();return}
  const card=(j,cls)=>j<n?`<div class="qc ${cls}" style="${grad(P.k)}${noAnim?';animation:none':''}"><div class="hd"><span>${D.em} ${D.n[L]}</span><span>${t('lv'+D.lvl)}</span></div><p>${esc(D.q[j][L])}</p><div class="ft">${cls==='top'?t('swipe'):''}</div><span class="wm">${D.em}</span></div>`:'';
  const fav=S.favQ.includes(D.q[P.i][L]);
  el.innerHTML=`<div class="inner"><div class="row"><button class="ibtn" data-a="closePlay" aria-label="${t('close')}">✕</button><div class="grow"><div class="row sp sm" style="font-weight:800;margin-bottom:5px"><span>${D.n[L]}</span><span class="num mut">${P.i+1} / ${n}</span></div><div class="bar"><i style="width:${(P.i+1)/n*100}%"></i></div></div></div>
   <div class="stack">${card(P.i+2,'n2')}${card(P.i+1,'n1')}${card(P.i,'top')}</div>
   <div class="pctl"><button class="pb1" data-a="pPrev" aria-label="${t('back')}">↩</button><button class="pb1" data-a="pFav" aria-label="❤">${fav?'❤️':'🤍'}</button><button class="pb1" data-a="pRnd" aria-label="🎲">🎲</button><button class="pb1 xl" data-a="pNext" aria-label="${t('next')}">→</button></div></div>`;
  const c=$('#play .qc.top');let sx=0,dx=0,drag=false;
  c.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;dx=0;try{c.setPointerCapture(e.pointerId)}catch(_){}c.style.transition='none';c.style.animation='none'});
  c.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;c.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`});
  const end=()=>{if(!drag)return;drag=false;c.style.transition='';if(Math.abs(dx)>80)fly(dx>0?1:-1);else c.style.transform=''};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)}
function fly(dir){const c=$('#play .qc.top');if(!c||ui.flying)return;ui.flying=true;c.style.animation='none';c.style.transition='transform .3s ease-in,opacity .3s';c.style.transform=`translateX(${dir*130}%) rotate(${dir*22}deg)`;c.style.opacity='0';
  const a=$('#play .qc.n1'),b=$('#play .qc.n2');if(a){a.style.transform='none';a.style.filter='none'}if(b)b.style.transform='translateY(16px) scale(.94)';
  setTimeout(()=>{ui.flying=false;if(!P)return;P.i++;S.seen[P.k]=Math.max(S.seen[P.k]||0,P.i);save();renderPlay(true)},280)}

  const my=myStatus(),run=STS[my.k].track;
  return subTop(t('tr_t'))+`<div class="hero st livehero ${run?'on':''}"><div class="lbl">${t('st_t')}${S.type!=='solo'?' · '+(shareOn(S)?'👁 '+esc(sname(S)):'🔒'):''}</div><div class="big num ${run?'livet':''}" ${run?`data-s="${my.start}"`:''}>${run?hms(Date.now()-new Date(my.start)):STS[my.k].em}</div>
    <div style="font-weight:800;font-size:18px">${stLbl(my.k)}</div><div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:12px">${Object.keys(STS).filter(x=>x!==my.k).map(x=>`<button class="gopill" data-a="setSt" data-v="${x}">${stLbl(x)}</button>`).join('')}</div></div>
  <div class="chips st">${TRK.map(x=>`<button class="chip ${k===x?'on':''}" data-a="trk" data-v="${x}">${stLbl(x)}</button>`).join('')}</div>
  <div class="card st col"><h2>${t('lv_stats')} · ${stLbl(k)}</h2>${st.map((x,i)=>`<div class="lvst"><span class="rank">${people.length>1?['🥇','🥈','🥉'][i]||'·':'📊'}</span><span class="av" style="box-shadow:none;background:var(--surface2)">${x.m.a}</span><div class="grow"><b>${esc(x.m.n)}</b><div class="mut sm">${x.c} ${t('lv_cnt')} · ${x.mc} ${t('lv_month')} · ${t('lv_tot')} ${dur(x.tot||0)}</div></div><div class="sm" style="text-align:right">${x.c?`<div>${t('lv_avg')} <b>${dur(x.avg)}</b></div><div class="mut">${t('lv_max')} ${dur(x.mx)}</div>`:'—'}</div></div>`).join('')}</div>
  <div class="card st"><div class="row sp" style="margin-bottom:4px"><h2>${t('lv_hist')}</h2><button class="btn ghost sm" data-a="lvMan">${t('lv_manual')}</button></div>${ses.slice(0,40).map(x=>{const s0=new Date(x.start),e0=new Date(x.end);return `<div class="it"><span class="av" style="box-shadow:none;background:var(--surface2)">${(mem(x.who)||{a:'·'}).a}</span><div class="grow"><b>${esc(wn(x.who))}</b> · ${dur(e0-s0)} ${x.r?`<span style="color:var(--pri)">${'♥'.repeat(x.r)}</span>`:''}<div class="mut sm">${fmt(dstr(s0))} · ${s0.toTimeString().slice(0,5)}–${e0.toTimeString().slice(0,5)}${x.n?' · '+esc(x.n):''}</div></div>${x.who===ME.id?`<button class="xb" data-a="lvDel" data-v="${x.id}" aria-label="${t('del')}">×</button>`:''}</div>`}).join('')||`<p class="mut sm" style="margin:8px 0 0">${t('lv_e')}</p>`}</div>`};
function lvMan(){const m=ui.lvm;sheet(`<h1>${t('lv_manual_t')}</h1><div class="chips">${TRK.map(x=>`<button type="button" class="chip ${m.k===x?'on':''}" data-a="lmK" data-v="${x}">${stLbl(x)}</button>`).join('')}</div>
  <label class="f" for="lm-d">${t('in_date')}<input class="inp" type="date" id="lm-d" value="${m.d}" max="${today()}"></label>
  <div class="grid2"><label class="f" for="lm-s">${t('lv_time')}<input class="inp" type="time" id="lm-s" value="${m.s}"></label><label class="f" for="lm-e">${t('lv_end')}<input class="inp" type="time" id="lm-e" value="${m.e}"></label></div>
  <div class="lvsum"><small>${t('lv_dur')}</small><b class="num" id="lm-dur">—</b></div>
  ${m.k==='sex'?`<div class="f">${t('in_rate')}<div class="hearts">${[1,2,3,4,5].map(n=>`<button type="button" data-a="lmR" data-v="${n}" aria-label="${n}/5">${n<=m.r?'❤️':'🤍'}</button>`).join('')}</div></div>`:''}
  <label class="f" for="lm-n">${t('in_note')}<input class="inp" id="lm-n" maxlength="60" autocomplete="off" value="${esc(m.n)}"></label><button class="btn" data-a="lmSave">${t('lv_save')}</button>`);lmDur()}
const lmSpan=()=>{const m=ui.lvm,st=new Date(m.d+'T'+m.s);let en=new Date(m.d+'T'+m.e);if(en<=st)en=new Date(en.getTime()+864e5);return[st,en]};
function lmRead(){const m=ui.lvm;m.d=$('#lm-d').value||today();m.s=$('#lm-s').value||'21:00';m.e=$('#lm-e').value||'21:30';m.n=$('#lm-n').value.trim()}
function lmDur(){const el=$('#lm-dur');if(!el)return;lmRead();const[a,b]=lmSpan();el.textContent=isNaN(a)||isNaN(b)?'—':dur(b-a)}
document.addEventListener('input',e=>{if(e.target&&['lm-d','lm-s','lm-e'].includes(e.target.id))lmDur()});
document.addEventListener('change',e=>{if(e.target&&['lm-d','lm-s','lm-e'].includes(e.target.id))lmDur()});
Object.assign(A,{
 stSheet:()=>statusSheet(),setSt:(d,el)=>setStatus(d.v,el),trk:d=>{ui.trk=d.v;refresh()},
 shareTog:d=>{ME.ui.share=Object.assign({},ME.ui.share||{});const s=ROOT.spaces[d.v];ME.ui.share[d.v]=!shareOn(s);shareSync(s);save();statusSheet();refresh()},
 lvSave:()=>{ui.lv.n=$('#lv-n').value.trim();saveSession(ui.lv);ui.lv=null;save();closeSheet();confetti();refresh()},
 lvDel:d=>{mySpaces().forEach(s=>{if(s.sessions)s.sessions=s.sessions.filter(x=>!(x.id===d.v&&x.who===ME.id))});H().intim=H().intim.filter(e=>e.sid!==d.v);save();refresh();toast(t('deleted'))},
 lvMan:()=>{ui.lvm={k:ui.trk||'sex',d:today(),s:'21:00',e:'21:30',r:4,n:''};lvMan()},
 lmK:d=>{lmRead();if(STS[d.v].adult&&!ME.adult)return gate('status','free');ui.lvm.k=d.v;lvMan()},lmR:d=>{lmRead();ui.lvm.r=+d.v;lvMan()},
 lmSave:()=>{lmRead();const m=ui.lvm,[st,en]=lmSpan();if(isNaN(st)||isNaN(en)||en<=st)return toast(t('lv_badend'));
   const x={id:uid(),k:m.k,who:ME.id,start:st.toISOString(),end:en.toISOString(),r:m.k==='sex'?m.r:0,n:m.n};saveSession(x);
   mySpaces().forEach(s=>{if(s.type!=='solo'&&shareOn(s))feedTo(s,'fe_ste',stLbl(m.k),dur(en-st))});ui.lvm=null;save();closeSheet();confetti();refresh()}
});
delete A.lvStart;delete A.lvStop;

/* ================= boot ================= */
applyTheme();loading(true);
sb.auth.getSession().then(({data})=>{if(data&&data.session)startSession(data.session.user);else renderAuth()}).catch(()=>renderAuth());
sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT'&&ME){ME=null;S=null;renderAuth()}});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
